tspan><tspan x="0" y="16.1">SWE = SP + WC</tspan></text></g><g class="pele-node pele-shape-rect proc" data-id="SO" transform="translate(652.01,436)"><rect x="-61.56" y="-24" width="123.13" height="48" fill="#f5f5f5" stroke="#1f1f1f" style="rx:4px;fill:#e8f1fa;stroke:#1f4e79;"/><text class="pele-label" style="fill:#0d2b45;" x="0" y="5.6" text-anchor="middle">Soil process</text></g><g class="pele-node pele-shape-rect eq" data-id="E4" transform="translate(565.33,276)"><rect x="-85.55" y="-33" width="171.09" height="66" fill="#f5f5f5" stroke="#1f1f1f" style="rx:4px;fill:#f5f5f5;stroke:#8a8a8a;"/><text class="pele-label" style="fill:#1f1f1f;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">AET = PET x min(1,</tspan><tspan x="0" y="16.1">SM/(LP x FC))</tspan></text></g><g class="pele-node pele-shape-rect eq" data-id="E5" transform="translate(785.25,276)"><rect x="-94.37" y="-33" width="188.74" height="66" fill="#f5f5f5" stroke="#1f1f1f" style="rx:4px;fill:#f5f5f5;stroke:#8a8a8a;"/><text class="pele-label" style="fill:#1f1f1f;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Recharge</tspan><tspan x="0" y="16.1">R = w x (SM/FC)^beta</tspan></text></g><g class="pele-node pele-shape-rect proc" data-id="GW" transform="translate(857.67,562)"><rect x="-51.78" y="-24" width="103.55" height="48" fill="#f5f5f5" stroke="#1f1f1f" style="rx:4px;fill:#e8f1fa;stroke:#1f4e79;"/><text class="pele-label" style="fill:#0d2b45;" x="0" y="5.6" text-anchor="middle">GW flows</text></g><g class="pele-node pele-shape-rect eq" data-id="E6" transform="translate(828.49,436)"><rect x="-74.92" y="-33" width="149.84" height="66" fill="#f5f5f5" stroke="#1f1f1f" style="rx:4px;fill:#f5f5f5;stroke:#8a8a8a;"/><text class="pele-label" style="fill:#1f1f1f;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Percolation =</tspan><tspan x="0" y="16.1">min(PERC, SUZ)</tspan></text></g><g class="pele-node pele-shape-rect eq" data-id="E7" transform="translate(1047.54,436)"><rect x="-104.12" y="-54" width="208.25" height="108" fill="#f5f5f5" stroke="#1f1f1f" style="rx:4px;fill:#f5f5f5;stroke:#8a8a8a;"/><text class="pele-label" style="fill:#1f1f1f;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.9">Interflow = SUZ x k1;</tspan><tspan x="0" y="-4.9">Baseflow = SLZ x k2;</tspan><tspan x="0" y="16.1">Shallow flow =</tspan><tspan x="0" y="37.1">max(0, (SUZ - UZL) x k0)</tspan></text></g><g class="pele-node pele-shape-rect proc" data-id="RT" transform="translate(857.67,692)"><rect x="-90.37" y="-33" width="180.74" height="66" fill="#f5f5f5" stroke="#1f1f1f" style="rx:4px;fill:#e8f1fa;stroke:#1f4e79;"/><text class="pele-label" style="fill:#0d2b45;" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Triangular weighting</tspan><tspan x="0" y="16.1">(MAXBAS)</tspan></text></g><g class="pele-node pele-shape-rect store" data-id="Q" transform="translate(857.67,797)"><rect x="-97.42" y="-24" width="194.84" height="48" fill="#f5f5f5" stroke="#1f1f1f" style="rx:4px;fill:#eaf5ea;stroke:#2e6b2e;"/><text class="pele-label" style="fill:#123d12;" x="0" y="5.6" text-anchor="middle">Routed streamflow (q)</text></g></g></svg>